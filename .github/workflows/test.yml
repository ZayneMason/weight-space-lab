name: Tests and packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU test dependencies
        run: |
          python -m pip install numpy==2.3.5 safetensors==0.8.0 minatar==1.0.15 math-verify==0.9.0 latex2sympy2_extended==1.11.0 antlr4-python3-runtime==4.13.2
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Python tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s qwen -p 'test_*.py' -v
      - name: Plugin tests
        run: node --test tests/plugin.test.mjs
      - name: Offline workflows and controller controls
        run: |
          python lab.py demo runs/ci-demo
          python lab.py verify runs/ci-demo
          python scripts/check_controller.py runs/ci-controller
          python lab.py experiment audit runs/ci-controller
          python scripts/check_editor_session.py runs/ci-editor
          python lab.py editor audit runs/ci-editor scripted
          python lab.py benchmark create runs/ci-benchmark --config experiments/editing-benchmark/pilot.example.json
          python lab.py benchmark run runs/ci-benchmark
          python lab.py benchmark audit runs/ci-benchmark
      - name: Build distribution packages
        run: python scripts/package.py
