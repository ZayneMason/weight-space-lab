<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-labelledby="plot-title plot-desc">
<title id="plot-title">Sign classifier: actual predictions before and after a prewritten edit</title>
<desc id="plot-desc">Six fixed examples. The baseline misclassifies all six; the candidate fixes all six. Green means correct; red means incorrect. Labels show predicted class.</desc>
<rect width="880" height="340" fill="#ffffff"/>
<text x="30" y="32" fill="#182433" font-family="system-ui" font-size="18" font-weight="700">Prewritten sign-classifier repair</text>
<text x="30" y="57" fill="#526477" font-family="system-ui" font-size="14">Class 0 = negative · Class 1 = positive · green = correct · red = incorrect</text>
<text x="30" y="130" fill="#182433" font-family="system-ui" font-size="16">Baseline</text>
<line x1="160" y1="125" x2="800" y2="125" stroke="#b4c1cd"/>
<line x1="449.52" y1="94" x2="449.52" y2="156" stroke="#8c9baa" stroke-dasharray="4 4"/>
<circle data-example="sign-0" cx="210.79" cy="125" r="11" fill="#bd4b4b"/>
<text x="210.79" y="130" text-anchor="middle" fill="white" font-family="system-ui" font-size="14">1</text>
<text x="210.79" y="167" text-anchor="middle" fill="#526477" font-family="system-ui" font-size="14">-4.7</text>
<circle data-example="sign-1" cx="342.86" cy="125" r="11" fill="#bd4b4b"/>
<text x="342.86" y="130" text-anchor="middle" fill="white" font-family="system-ui" font-size="14">1</text>
<text x="342.86" y="167" text-anchor="middle" fill="#526477" font-family="system-ui" font-size="14">-2.1</text>
<circle data-example="sign-2" cx="434.29" cy="125" r="11" fill="#bd4b4b"/>
<text x="434.29" y="130" text-anchor="middle" fill="white" font-family="system-ui" font-size="14">1</text>
<text x="434.29" y="167" text-anchor="middle" fill="#526477" font-family="system-ui" font-size="14">-0.3</text>
<circle data-example="sign-3" cx="459.68" cy="125" r="11" fill="#bd4b4b"/>
<text x="459.68" y="130" text-anchor="middle" fill="white" font-family="system-ui" font-size="14">0</text>
<text x="459.68" y="185" text-anchor="middle" fill="#526477" font-family="system-ui" font-size="14">0.2</text>
<circle data-example="sign-4" cx="530.79" cy="125" r="11" fill="#bd4b4b"/>
