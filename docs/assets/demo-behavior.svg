<text x="530.79" y="167" text-anchor="middle" fill="#526477" font-family="system-ui" font-size="14">1.6</text>
<circle data-example="sign-5" cx="749.21" cy="125" r="11" fill="#bd4b4b"/>
<text x="749.21" y="130" text-anchor="middle" fill="white" font-family="system-ui" font-size="14">0</text>
<text x="749.21" y="167" text-anchor="middle" fill="#526477" font-family="system-ui" font-size="14">5.9</text>
<text x="30" y="235" fill="#182433" font-family="system-ui" font-size="16">Candidate</text>
